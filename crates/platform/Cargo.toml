[package]
name = "tuoen-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "tuoen 的平台层：所有 Win32 调用都收在这里，业务逻辑不得出现 #[cfg(windows)]。"
publish = false

[features]
# 给**别的 crate 的测试**用：`tuoen-platform` 的临时目录等测试工具。
# 只在 `dev-dependencies` 里开，不会进入任何发布产物。
test-support = []

[lints]
workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

# 只开真正用到的 feature（理由见 `src/sys.rs` 头部注释）：
# `Win32_Foundation`（HANDLE / 错误码）、`Win32_Storage_FileSystem`（`FindFirstFileW`）、
# `Win32_System_Registry`（注册表枚举）。三个 reparse tag 常量所在的
# `Win32_System_SystemServices` / `Win32_System_Ioctl` 故意不开 —— 为两个常量引入两个
# feature 不值，改为在 `src/sys.rs` 里定义并用测试钉住取值。
#
# **必须在 `cfg(windows)` 下**：`windows-sys` 只在 Windows 目标上提供 `Win32` 模块。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_IO",
    # `CreateFileW` 被 `#[cfg(feature = "Win32_Security")]` gate 住了（它的
    # 形参里有 `*const SECURITY_ATTRIBUTES`）。虽然我们永远传 NULL，
    # 但**要拿到那个符号就必须开这个 feature** —— 这是实测出来的，
    # 报错是 `unresolved import windows_sys::Win32::Storage::FileSystem::CreateFileW`。
    "Win32_Security",
    # `SendMessageTimeoutW` 与 `HWND_BROADCAST` / `WM_SETTINGCHANGE` 在这里。
    # 这个 feature 的面很大，但它是**编译期**的：`platform` 不在任何热路径上
    # （shim 的依赖图里只有 `windows-sys` 的五个 feature，不含这一个）。
    "Win32_UI_WindowsAndMessaging",
    # `system.elevated` 要问一次"这个进程现在有没有管理员权限"：
    # `OpenProcessToken` / `GetCurrentProcess` 在 `Win32_System_Threading` 里 ——
    # windows-sys 0.61.2 把它 gate 在那个 feature 后面，没有它就是
    # `could not find Threading in System`（实测报错）。
    "Win32_System_Threading",
] }

[dev-dependencies]
serde_json.workspace = true
