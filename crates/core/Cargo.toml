[package]
name = "tuoen-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "tuoen 的引擎：检测、捕获、诊断、plan/diff/apply。不直接调用 Win32。"
publish = false

[lints]
workspace = true

[dependencies]
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
# 检测引擎通过 trait 拿文件系统 / 注册表 / 进程执行器，所以它依赖 platform
# 的类型定义 —— 但**不直接调用 Win32**。这条边界是 spec 里写明的。
tuoen-platform = { path = "../platform" }
# `tuoen list` 列的是**我们自己的存储**，所以 core 要知道 store 的存在。
# 方向是 core → store → platform，没有反向边：store 不知道"检测"是什么。
tuoen-store = { workspace = true }
# `pin` 要读解压布局（`Layout`）才能算出"该把哪个目录前置进子进程 PATH"。
# 抄一份字段名会在某次改名之后静默算错那个目录 —— 而错的那个目录仍然能被启动。
tuoen-manifest = { workspace = true }
# 信任指纹用的就是**同一个** sha256 实现（`sha256_hex`）。
# 指纹的算法只该有一处：两份实现里只要有一份动了，"信任过的东西"就会集体失配。
tuoen-download = { workspace = true }
# `doctor` 要认得 shim 目录里的**模板**（它跟真正的 shim 躺在同一个目录里，
# 不是一条命令）。模板文件名只有一处定义，所以直接引用它 —— 抄一份字符串
# 会在某次改名后静默变成"把模板当成一条 shim 报出去"。
tuoen-shim = { workspace = true }
# 全局包清单（`globals`）要解析**工具自己的 JSON 输出**：决策 168 把命令冻结成
# `npm ls -g --json` 与 `pip list --format=json`，而决策 175 的 `bad-json` /
# `unsupported-output` 就是"解析不了 / 形状不认识"。手写一个小 JSON 解析器是
# "两个实现迟早对同一份输入给出不同答案"的形状（决策 178 的同一条理由），
# 而 npm 的输出里有转义与嵌套 —— 手写的那个一定是错的。所以 lib 直接依赖 serde_json。
serde_json.workspace = true

[dev-dependencies]
tuoen-platform = { path = "../platform", features = ["test-support"] }
