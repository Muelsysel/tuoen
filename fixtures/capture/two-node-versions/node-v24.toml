# 场景：决策 172/174 —— 同一个 prefix 在**两个 Node 版本**下是**两份独立清单**
#
# 这一份是 v24.19.0 那一侧；`node-v22.toml` 是同机换成 v22.11.0 的形态。
# 两份的 prefix **逐字相同**（`C:\nvm4w\nodejs`），只有：
#   - 联接目标（版本目录）不同
#   - `node -v` 的回答不同（⇒ tool_version 不同）
#   - `npm ls -g --json` 的包集合不同
# 于是"清单按工具版本隔离"这件事才有可断言的形状：
#   两份的 tool_version 与包集合都必须各自等于**它们自己那份 fixture** 里的文本，
#   且不许被合并成一份。

[env]
USERPROFILE = 'C:\Users\dev'
APPDATA = 'C:\Users\dev\AppData\Roaming'
LOCALAPPDATA = 'C:\Users\dev\AppData\Local'
Path = 'C:\Windows\System32;C:\nvm4w\nodejs'

[[paths]]
path = 'C:\nvm4w\nodejs'
is_dir = true
reparse = 'symlink-dir'
link_target = 'C:\Users\dev\AppData\Local\nvm\v24.19.0'

[[dirs]]
path = 'C:\nvm4w\nodejs'
entries = [
    { path = 'node.exe', size = 84043264 },
    { path = 'npm.cmd', size = 340 },
]

[[dirs]]
path = 'C:\Users\dev\AppData\Local\nvm\v24.19.0'
entries = [{ path = 'node.exe', size = 84043264 }]

[[processes]]
program = 'node.exe'
args = ['-v']
stdout = "v24.19.0\n"
exit_code = 0

[[processes]]
program = 'cmd.exe'
args = ['/C', 'npm.cmd', 'config', 'get', 'prefix']
stdout = "C:\\nvm4w\\nodejs\n"
exit_code = 0

[[processes]]
program = 'cmd.exe'
args = ['/C', 'npm.cmd', 'ls', '-g', '--json', '--depth=0', '--offline']
stdout = "{\n  \"name\": \"lib\",\n  \"dependencies\": {\n    \"@deepseek-ai/dsh\": { \"version\": \"1.4.2\" },\n    \"@openai/codex\": { \"version\": \"0.9.1\" },\n    \"corepack\": { \"version\": \"0.29.4\" },\n    \"npm\": { \"version\": \"11.4.2\" },\n    \"pnpm\": { \"version\": \"10.12.1\" },\n    \"typescript\": { \"version\": \"5.7.2\" },\n    \"vercel\": { \"version\": \"41.7.0\" }\n  }\n}\n"
exit_code = 0
