# 场景：幂等 —— 同一份装置、同一个 `captured_at`，跑两次必须**逐字节相同**
#
# 这一份故意做得**杂**：两种工具（npm + pip）、四种配置文件、三种跳过项
# （缓存目录 / 私钥 / 已知主机）、一个 JetBrains 产品目录标记行。
# 只测一种东西的幂等是廉价的：顺序抖动、`BTreeMap` 之外的 `HashMap` 迭代、
# 时间戳、随机 id —— 这些都会在"条目够多、种类够杂"时才露出来。
#
# 测试自己从这份文件数：包数、跳过项数、以及每个 `content` 的 sha256。
# 两次捕获的 **文件文本** 逐字节相同、每个 `content_hash` 两次相同。

