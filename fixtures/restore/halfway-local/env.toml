# 9 条：用户级 5 + 机器级 4。按（名称忽略大小写，作用域）排序。
#
# 可数的量：
# - 条数 = 9；`scope = "user"` 5 条、`scope = "machine"` 4 条
# - `NVM_HOME` 在**两个作用域都有**（真机实测的"双重管理腐坏"，决策 154 的活证据）
# - `target_exists` 三种取值都有：`yes` / `no` / `not-a-path`
# - `CANARY_LEAKED_TOKEN` 是**故意种下的假凭据**：固定装置里真的有 token 形状的
#   字符串，plan 的输出里一个字节都不许出现它（见 README）。
#   它的**形状是刻意的**：没有 `glpat-` / `ghp_` / `sk-` 这类真厂商前缀，因为本仓库
#   被 GitHub push protection（GH013）拦过一次 —— 我们自己写的检测形状被它当成了真
#   token。测试里查 `glpat-` 前缀用的是 `concat!("glpat", "-")`，不是字面量。

